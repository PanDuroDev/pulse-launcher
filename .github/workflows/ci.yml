name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Only version tags publish an installer. The installer is attached directly
  # to GitHub Releases; workflow artifacts are supplementary diagnostics.
  release:
    name: Build and publish Windows installer
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build and verify installer
        run: npm run dist
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Validate release files and write SHA-256 checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne "v$version") {
            throw "Release tag '$tag' does not match package.json version 'v$version'. Update package.json or push the matching tag."
          }

          $exe = @(Get-ChildItem release -File -Filter 'Pulse-Launcher-*-x64.exe')
          $blockmap = @(Get-ChildItem release -File -Filter 'Pulse-Launcher-*-x64.exe.blockmap')
          $latest = Join-Path $PWD 'release/latest.yml'

          if ($exe.Count -ne 1) {
            throw "Expected exactly one x64 installer, found $($exe.Count)."
          }
          if ($blockmap.Count -ne 1) {
            throw "Expected exactly one installer blockmap, found $($blockmap.Count)."
          }
          if (-not (Test-Path -LiteralPath $latest -PathType Leaf)) {
            throw 'release/latest.yml is missing.'
          }

          $files = @($exe[0], $blockmap[0], (Get-Item -LiteralPath $latest))
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -LiteralPath 'release/SHA256SUMS.txt' -Encoding ascii
          $lines

          $hash = (Get-FileHash -LiteralPath $exe[0].FullName -Algorithm SHA256).Hash
          "### Windows installer" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "File: $($exe[0].Name)" >> $env:GITHUB_STEP_SUMMARY
          "Size: $([math]::Round($exe[0].Length / 1MB, 1)) MB ($($exe[0].Length) bytes)" >> $env:GITHUB_STEP_SUMMARY
          "SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY

      # The release upload below attaches the actual .exe. This artifact is a
      # supplementary workflow download and may be packaged as a ZIP.
      - name: Upload installer workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pulse-launcher-${{ github.ref_name }}-installer
          path: release/Pulse-Launcher-*-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload release metadata artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pulse-launcher-${{ github.ref_name }}-metadata
          path: |
            release/Pulse-Launcher-*-x64.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      # Workflow artifacts alone do not appear on the Releases page.
      - name: Publish GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $exe = @(Get-ChildItem release -File -Filter 'Pulse-Launcher-*-x64.exe')
          $blockmap = @(Get-ChildItem release -File -Filter 'Pulse-Launcher-*-x64.exe.blockmap')
          $assets = @(
            $exe[0].FullName
            $blockmap[0].FullName
            (Join-Path $PWD 'release/latest.yml')
            (Join-Path $PWD 'release/SHA256SUMS.txt')
          )
          $assetNames = @($exe[0].Name, $blockmap[0].Name, 'latest.yml', 'SHA256SUMS.txt')

          $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            $existingNames = @($release.assets | ForEach-Object { $_.name })
            $present = @($assetNames | Where-Object { $existingNames -contains $_ })

            if (-not $release.draft -and $present.Count -gt 0 -and $present.Count -ne $assetNames.Count) {
              throw "Published release '$tag' has only some expected assets. Refusing to alter a partially populated published release; repair its assets manually and rerun."
            }

            if ($present.Count -ne $assetNames.Count) {
              # Draft releases can be safely resumed after a transient partial upload.
              # Upload only missing files; never clobber existing assets.
              $missingAssets = @()
              for ($i = 0; $i -lt $assetNames.Count; $i++) {
                if ($existingNames -notcontains $assetNames[$i]) {
                  $missingAssets += $assets[$i]
                }
              }
              gh release upload $tag $missingAssets
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to upload missing assets to release '$tag'."
              }
            } else {
              Write-Host "All expected assets already exist on '$tag'; preserving them on rerun."
            }

            if ($release.draft) {
              gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" -F draft=false | Out-Null
              if ($LASTEXITCODE -ne 0) {
                throw "Assets uploaded, but failed to publish draft release '$tag'."
              }
            }
          } else {
            gh release create $tag $assets --verify-tag --generate-notes --title "Pulse Launcher $tag"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create release '$tag' with its assets."
            }
          }
