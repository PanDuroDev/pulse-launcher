name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every push and pull request must pass the same four gates used locally:
  # tests, typecheck, lint (4 known warnings / 0 errors), and a full build.
  verify:
    name: Verify
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # A version tag is the only thing that produces an installer. It re-runs the
  # gates first, then `npm run dist` ends with `verify-installer.mjs`, so a
  # build that somehow produced an older package fails here instead of shipping.
  release:
    name: Installer
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # electron-builder downloads Electron and the NSIS toolchain on the first
      # build. Caching them keeps tagged releases close to the Verify runtime.
      - name: Cache Electron
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - run: npm ci --no-audit --no-fund

      # Signing is off until a code-signing certificate exists; the decision is
      # documented in docs/audit/01-release-and-packaging.md §3. Adding the two
      # repository secrets below is the whole switch: electron-builder picks them
      # up and flips the fuses before signing.
      - name: Build installer
        run: npm run dist
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Write checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File | Where-Object {
            $_.Name -like 'Pulse-Launcher-*-x64.exe' -or
            $_.Name -like 'Pulse-Launcher-*-x64.exe.blockmap' -or
            $_.Name -eq 'latest.yml'
          }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii
          $lines

      - name: Summarize installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter 'Pulse-Launcher-*-x64.exe' | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          "### Windows installer" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "**File:** ``$($exe.Name)``" >> $env:GITHUB_STEP_SUMMARY
          "**Size:** $([math]::Round($exe.Length / 1MB, 1)) MB ($($exe.Length) bytes)" >> $env:GITHUB_STEP_SUMMARY
          "**SHA-256:** ``$hash``" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "The raw installer is also attached to the GitHub Release." >> $env:GITHUB_STEP_SUMMARY

      # `archive: false` is what makes the artifact a real .exe instead of the
      # ZIP wrapper GitHub normally creates. The artifact name is taken from the
      # file, so `name:` is intentionally omitted.
      - name: Upload raw installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: release/Pulse-Launcher-*-x64.exe
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      # The blockmap and latest.yml are what an auto-update feed would consume,
      # so they ship alongside the installer from day one.
      - name: Upload update metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulse-launcher-${{ github.ref_name }}-metadata
          path: |
            release/Pulse-Launcher-*-x64.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      # A tag creates a real GitHub Release with the raw installer, not only a
      # workflow artifact. Re-running the same tag replaces the assets instead
      # of failing on an existing release.
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
            (Get-ChildItem release -Filter 'Pulse-Launcher-*-x64.exe').FullName
            (Get-ChildItem release -Filter 'Pulse-Launcher-*-x64.exe.blockmap').FullName
            (Join-Path $PWD 'release/latest.yml')
            (Join-Path $PWD 'release/SHA256SUMS.txt')
          )
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
          } else {
            gh release create $tag $assets --verify-tag --generate-notes --title "Pulse Launcher $tag"
          }
